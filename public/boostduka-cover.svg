<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aperçu du tableau de bord BoostDuka">
  <defs>
    <linearGradient id="bd-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2F7"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="400" height="300" rx="18" fill="url(#bd-bg)"/>
  <rect x="0.5" y="0.5" width="399" height="299" rx="17.5" fill="none" stroke="#E2E8F0"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="400" height="46" rx="18" fill="#1E3A8A"/>
  <rect x="0" y="28" width="400" height="18" fill="#1E3A8A"/>
  <circle cx="26" cy="23" r="9" fill="#FFFFFF"/>
  <text x="26" y="27" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#1E3A8A" text-anchor="middle">BK</text>
  <text x="44" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">BoostDuka</text>
  <text x="44" y="32" font-family="Arial, sans-serif" font-size="7" fill="#C7D2E8" letter-spacing="0.5">DASHBOARD KPI PROCUREMENT</text>
  <rect x="336" y="14" width="48" height="18" rx="9" fill="#047857"/>
  <text x="360" y="26" font-family="Arial, sans-serif" font-size="7" font-weight="700" fill="#FFFFFF" text-anchor="middle">DEMO</text>

  <!-- KPI tiles -->
  <g>
    <rect x="20" y="62" width="110" height="58" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="38" cy="80" r="10" fill="#04785720"/>
    <path d="M34 80 l3 3 l7 -7" stroke="#047857" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="78" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#0F172A">65.9%</text>
    <text x="56" y="90" font-family="Arial, sans-serif" font-size="6.5" fill="#64748B">LIVRAISON A TEMPS</text>
  </g>
  <g>
    <rect x="145" y="62" width="110" height="58" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="163" cy="80" r="10" fill="#B4530920"/>
    <path d="M158 84 l4 -8 l3 4 l5 -9" stroke="#B45309" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="181" y="78" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#0F172A">17.9j</text>
    <text x="181" y="90" font-family="Arial, sans-serif" font-size="6.5" fill="#64748B">LEAD TIME MOYEN</text>
  </g>
  <g>
    <rect x="270" y="62" width="110" height="58" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="288" cy="80" r="10" fill="#1E3A8A20"/>
