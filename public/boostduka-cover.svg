    <text x="306" y="78" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#0F172A">49.7%</text>
    <text x="306" y="90" font-family="Arial, sans-serif" font-size="6.5" fill="#64748B">UTILISATION LTA</text>
  </g>

  <!-- Bar chart panel -->
  <rect x="20" y="134" width="220" height="146" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="34" y="152" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#334155">REPARTITION BUDGETAIRE</text>
  <g stroke="#EEF2F7">
    <line x1="34" y1="260" x2="226" y2="260"/>
    <line x1="34" y1="230" x2="226" y2="230"/>
    <line x1="34" y1="200" x2="226" y2="200"/>
    <line x1="34" y1="170" x2="226" y2="170"/>
  </g>
  <g fill="#047857">
    <rect x="46" y="180" width="20" height="80" rx="3"/>
    <rect x="82" y="200" width="20" height="60" rx="3"/>
    <rect x="118" y="165" width="20" height="95" rx="3" fill="#0E9A72"/>
    <rect x="154" y="215" width="20" height="45" rx="3" fill="#B4530980"/>
    <rect x="190" y="225" width="20" height="35" rx="3" fill="#B4530980"/>
