  <!-- Trend / line panel -->
  <rect x="252" y="134" width="128" height="146" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="266" y="152" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#334155">PERFORMANCE LIVRAISON</text>
  <text x="266" y="196" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#047857">65.9%</text>
  <text x="266" y="210" font-family="Arial, sans-serif" font-size="6.5" fill="#64748B">LIVRE A TEMPS</text>
  <polyline points="266,258 288,244 304,250 322,228 340,234 362,214" fill="none" stroke="#B45309" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="362" cy="214" r="3.5" fill="#B45309"/>
  <rect x="266" y="264" width="106" height="4" rx="2" fill="#F1F5F9"/>
  <rect x="266" y="264" width="70" height="4" rx="2" fill="#047857"/>
</svg>
