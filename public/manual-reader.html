<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="description" content="Lecture en ligne, page par page, du manuel Full-Guideline BK-BOOST Ltd. — Version 1.">
<title>Lecture — Full-Guideline BK-BOOST Ltd.</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --navy-deep:#071726;
    --navy-mid:#0c3244;
    --cream:#f4f0e6;
    --gold:#c68a3f;
    --emerald:#1f9d72;
    --ink-soft:#a9b7c2;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background: radial-gradient(120% 140% at 50% -10%, #123044 0%, var(--navy-mid) 40%, var(--navy-deep) 85%);
    color: var(--cream);
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    overflow: hidden;
    height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .reader{
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  .bar{
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    padding: 0 clamp(14px, 3vw, 28px);
    height: 56px;
    background: rgba(7, 23, 38, 0.55);
    backdrop-filter: blur(6px);
  }

  .brand{
    color: var(--cream);
    text-decoration: none;
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.01em;
    opacity: 0.9;
    transition: opacity 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand:hover{ opacity: 1; color: var(--gold); }

  .counter{
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .counter b{ color: var(--cream); font-weight: 600; }

  .stage{
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    padding: 8px clamp(8px, 2vw, 20px);
  }

  .sheet-wrap{
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    scrollbar-color: var(--gold) rgba(244,240,230,0.08);
  }
  .sheet-wrap::-webkit-scrollbar{ width: 12px; height: 12px; }
  .sheet-wrap::-webkit-scrollbar-track{ background: rgba(244,240,230,0.06); }
  .sheet-wrap::-webkit-scrollbar-thumb{ background: var(--gold); border-radius: 999px; border: 2px solid var(--navy-deep); }

  .sheet{
    display: block;
    border-radius: 3px;
    box-shadow: 0 30px 70px -20px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.06);
    background: var(--cream);
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-user-drag: none;
    opacity: 0;
    cursor: zoom-in;
    transition: opacity 0.25s ease;
  }
  .sheet.loaded{ opacity: 1; }

  #stage.zoomed .zone{ pointer-events: none; }
  #stage.zoomed .sheet-wrap{
    overflow: auto;
    align-items: flex-start;
    justify-content: flex-start;
    cursor: auto;
  }
  #stage.zoomed .sheet{
    cursor: zoom-out;
  }

  .zoom-hint{
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(169,183,194,0.55);
    white-space: nowrap;
  }

  .skeleton{
    position: absolute;
    inset: 0;
    margin: auto;
    width: min(70vw, 520px);
    aspect-ratio: 595 / 842;
    max-height: 100%;
    background: linear-gradient(100deg, rgba(255,255,255,0.04) 30%, rgba(255,255,255,0.09) 50%, rgba(255,255,255,0.04) 70%);
    background-size: 200% 100%;
    animation: shimmer 1.3s ease-in-out infinite;
    border-radius: 3px;
    pointer-events: none;
  }
  .skeleton.hidden{ display: none; }
  @keyframes shimmer{
    0%{ background-position: 200% 0; }
    100%{ background-position: -200% 0; }
  }

  .zone{
    position: absolute;
    top: 0;
    bottom: 0;
    width: min(18%, 140px);
    border: none;
    background: transparent;
    cursor: pointer;
    z-index: 2;
  }
  .zone-prev{ left: 0; }
  .zone-next{ right: 0; }

  .bottom{
    gap: clamp(12px, 3vw, 28px);
    height: 64px;
  }

  .nav-btn{
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 999px;
    border: 1px solid rgba(244,240,230,0.18);
    background: rgba(244,240,230,0.06);
    color: var(--cream);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, border-color 0.2s, transform 0.15s;
  }
  .nav-btn:hover{ background: rgba(198,138,63,0.18); border-color: var(--gold); }
  .nav-btn:active{ transform: scale(0.94); }
  .nav-btn:disabled{ opacity: 0.3; cursor: default; }
  .nav-btn:disabled:hover{ background: rgba(244,240,230,0.06); border-color: rgba(244,240,230,0.18); }

  .progress{
    flex: 1;
    max-width: 420px;
    height: 3px;
    border-radius: 999px;
    background: rgba(244,240,230,0.12);
    overflow: hidden;
  }
  .progress-fill{
    height: 100%;
    width: 2.08%;
    background: linear-gradient(90deg, var(--gold), var(--emerald));
    transition: width 0.25s ease;
  }

  .notice{
    position: fixed;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    margin: 0;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(169,183,194,0.55);
    pointer-events: none;
    white-space: nowrap;
  }

  @media (max-width: 780px){
    .zoom-hint{ display: none; }
  }
  @media (max-width: 640px){
    .notice{ display: none; }
    .zone{ width: 24%; }
  }
</style>
</head>
<body>
  <div class="reader">
    <header class="bar">
      <a class="brand" href="./#portfolio" aria-label="Retour au portfolio">← BK-BOOST Ltd.</a>
      <span class="zoom-hint">Cliquer la page pour zoomer · Molette pour défiler</span>
      <div class="counter"><b id="pageNow">1</b> / <span id="pageTotal">48</span></div>
    </header>

    <main class="stage" id="stage">
      <button class="zone zone-prev" id="prevZone" aria-label="Page précédente"></button>
      <div class="sheet-wrap" id="sheetWrap">
        <div class="skeleton" id="skeleton"></div>
        <img id="sheet" class="sheet" alt="" draggable="false">
      </div>
      <button class="zone zone-next" id="nextZone" aria-label="Page suivante"></button>
    </main>

    <footer class="bar bottom">
      <button class="nav-btn" id="prevBtn" aria-label="Page précédente">‹</button>
      <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
      <button class="nav-btn" id="nextBtn" aria-label="Page suivante">›</button>
    </footer>
  </div>
  <p class="notice">Lecture seule — © BK-BOOST Ltd. Tous droits réservés</p>

<script>
(function(){
  var TOTAL = 48;
  var current = 1;
  var stage = document.getElementById('stage');
  var sheetWrap = document.getElementById('sheetWrap');
  var sheet = document.getElementById('sheet');
  var skeleton = document.getElementById('skeleton');
  var pageNow = document.getElementById('pageNow');
  var progressFill = document.getElementById('progressFill');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var prevZone = document.getElementById('prevZone');
  var nextZone = document.getElementById('nextZone');
  var cache = {};

  document.getElementById('pageTotal').textContent = TOTAL;

  function srcFor(n){
    var padded = n < 10 ? '0' + n : '' + n;
    return 'manual-pages/page-' + padded + '.jpg';
  }

  function preload(n){
    if (n < 1 || n > TOTAL || cache[n]) return;
    var img = new Image();
    img.src = srcFor(n);
    cache[n] = img;
  }

  var PAGE_RATIO = 1400 / 1980; // width / height of every rendered page image

  function layoutFit(){
    if (stage.classList.contains('zoomed')) return;
    var availW = sheetWrap.clientWidth;
    var availH = sheetWrap.clientHeight;
    if (!availW || !availH) return;
    var w = availW, h = w / PAGE_RATIO;
    if (h > availH) { h = availH; w = h * PAGE_RATIO; }
    sheet.style.width = Math.round(w) + 'px';
    sheet.style.height = Math.round(h) + 'px';
  }

  function setZoomed(on){
    stage.classList.toggle('zoomed', on);
    if (on) {
      sheet.style.width = '1400px';
      sheet.style.height = 'auto';
    } else {
      sheetWrap.scrollTop = 0;
      sheetWrap.scrollLeft = 0;
      layoutFit();
    }
  }

  window.addEventListener('resize', layoutFit);

  function render(n){
    var target = Math.max(1, Math.min(TOTAL, n));
    current = target;
    // Keep the current zoom level across page turns (like paging through a
    // presentation) — only reset the scroll position, not the zoom itself.
    sheetWrap.scrollTop = 0;
    sheetWrap.scrollLeft = 0;
    if (!stage.classList.contains('zoomed')) layoutFit();
    sheet.classList.remove('loaded');
    skeleton.classList.remove('hidden');

    var img = cache[target];
    if (!img) { img = new Image(); img.src = srcFor(target); cache[target] = img; }

    function show(){
      if (current !== target) return; // superseded by a later navigation — drop this stale load
      sheet.src = img.src;
      sheet.alt = 'Page ' + target + ' sur ' + TOTAL + ' — Full-Guideline BK-BOOST Ltd.';
      sheet.classList.add('loaded');
      skeleton.classList.add('hidden');
    }
    if (img.complete && img.naturalWidth > 0) { show(); }
    else { img.onload = show; }

    pageNow.textContent = target;
    progressFill.style.width = (target / TOTAL * 100).toFixed(2) + '%';
    prevBtn.disabled = target === 1;
    nextBtn.disabled = target === TOTAL;

    preload(target - 1);
    preload(target + 1);
  }

  function go(delta){ render(current + delta); }

  sheet.addEventListener('click', function(){
    setZoomed(!stage.classList.contains('zoomed'));
  });

  prevBtn.addEventListener('click', function(){ go(-1); });
  nextBtn.addEventListener('click', function(){ go(1); });
  prevZone.addEventListener('click', function(){ go(-1); });
  nextZone.addEventListener('click', function(){ go(1); });

  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowLeft') go(-1);
    else if (e.key === 'ArrowRight' || e.key === ' ') go(1);
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'p' || e.key === 'S' || e.key === 'P')) {
      e.preventDefault();
    }
  });

  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  var touchStartX = null;
  document.addEventListener('touchstart', function(e){
    touchStartX = e.changedTouches[0].clientX;
  }, { passive: true });
  document.addEventListener('touchend', function(e){
    if (touchStartX === null || stage.classList.contains('zoomed')) { touchStartX = null; return; }
    var dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 40) go(dx > 0 ? -1 : 1);
    touchStartX = null;
  }, { passive: true });

  render(1);
})();
</script>
</body>
</html>
