<svg viewBox="0 0 1300 400" xmlns="http://www.w3.org/2000/svg" font-family="'Plus Jakarta Sans', 'Inter', sans-serif">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1300" height="400" fill="none"/>

  <!-- SEA -->
  <rect x="0" y="250" width="320" height="150" fill="url(#sea)" opacity="0.9"/>
  <path d="M0,262 Q40,252 80,262 T160,262 T240,262 T320,262" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="4" fill="none"/>
  <path d="M0,280 Q40,270 80,280 T160,280 T240,280 T320,280" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3" fill="none"/>
  <circle cx="70" cy="258" r="7" fill="#B45309"/>
  <text x="70" y="234" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">Port d'origine</text>
  <path id="boatPath" d="M60,312 L280,312" fill="none"/>
  <path d="M60,312 L280,312" stroke="#FFFFFF" stroke-dasharray="6 6" stroke-width="2" opacity="0.6" fill="none"/>

  <!-- BOAT: cargo ship with containers + BK pennant -->
  <g>
    <animateMotion dur="4s" begin="0s" repeatCount="indefinite" rotate="0">
      <mpath href="#boatPath"/>
    </animateMotion>
    <g transform="translate(-35,-30)">
      <path d="M0,42 Q35,54 70,42" stroke="#FFFFFF" stroke-width="2.4" fill="none" opacity="0.55"/>
      <path d="M4,30 L66,30 L58,42 L12,42 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
      <rect x="6" y="26" width="58" height="4" fill="#1E3A8A" opacity="0.85"/>
      <rect x="10" y="10" width="15" height="16" fill="#047857"/>
      <line x1="10" y1="18" x2="25" y2="18" stroke="#FFFFFF" stroke-width="0.6" opacity="0.3"/>
      <rect x="27" y="6" width="15" height="20" fill="#B45309"/>
      <line x1="27" y1="16" x2="42" y2="16" stroke="#FFFFFF" stroke-width="0.6" opacity="0.3"/>
      <rect x="44" y="9" width="15" height="17" fill="#1E3A8A"/>
      <line x1="44" y1="17.5" x2="59" y2="17.5" stroke="#FFFFFF" stroke-width="0.6" opacity="0.3"/>
      <rect x="57" y="-2" width="11" height="14" rx="1.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="0.7"/>
      <rect x="59.5" y="1" width="5.5" height="4" fill="#0F172A"/>
      <line x1="10" y1="10" x2="10" y2="-19" stroke="#475569" stroke-width="1.6"/>
      <path d="M10,-19 L36,-11 L10,-3 Z" fill="#B45309" stroke="#7C2D12" stroke-width="0.4"/>
      <text x="13.5" y="-9.5" font-size="10" font-weight="800" fill="#FFFFFF">BK</text>
    </g>
  </g>
  <text x="160" y="374" text-anchor="middle" font-size="19" fill="#FFFFFF" font-weight="700" opacity="0.95">Fret maritime</text>

  <!-- HUB 1 -->
  <circle cx="320" cy="250" r="8" fill="#047857" stroke="#FFFFFF" stroke-width="3"/>
  <text x="320" y="224" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">Hub aérien</text>

  <!-- AIR -->
  <path id="planePath" d="M320,250 Q470,90 620,140" fill="none"/>
  <path d="M320,250 Q470,90 620,140" stroke="#1E3A8A" stroke-dasharray="8 8" stroke-width="2.5" opacity="0.55" fill="none"/>
  <text x="470" y="48" text-anchor="middle" font-size="19" fill="#1E3A8A" font-weight="700">Fret aérien</text>

  <!-- PLANE: clean cargo-plane silhouette with BK tail logo -->
  <g>
    <animateMotion dur="4s" begin="1s" repeatCount="indefinite" rotate="auto">
      <mpath href="#planePath"/>
    </animateMotion>
    <g transform="translate(-30,-12)">
      <path d="M8,8 L-8,2 L10,9 Z" fill="#0F172A" opacity="0.85"/>
      <path d="M26,14 L4,30 L30,16 Z" fill="#0F172A" opacity="0.9"/>
      <ellipse cx="30" cy="12" rx="28" ry="6.5" fill="#1E3A8A"/>
      <ellipse cx="54" cy="12" rx="6" ry="5" fill="#3B5BB0" opacity="0.6"/>
      <circle cx="16" cy="8.5" r="1" fill="#F8FAFC" opacity="0.9"/>
      <circle cx="22" cy="8.5" r="1" fill="#F8FAFC" opacity="0.9"/>
      <circle cx="28" cy="8.5" r="1" fill="#F8FAFC" opacity="0.9"/>
      <circle cx="34" cy="8.5" r="1" fill="#F8FAFC" opacity="0.9"/>
      <path d="M11,13 L-8,-17 L22,7 Z" fill="#0F172A"/>
      <circle cx="6.5" cy="-6" r="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.3"/>
      <text x="6.5" y="-3" font-size="7.8" font-weight="800" fill="#B45309" text-anchor="middle">BK</text>
    </g>
  </g>

  <!-- HUB 2 -->
  <circle cx="620" cy="140" r="8" fill="#047857" stroke="#FFFFFF" stroke-width="3"/>
  <text x="620" y="114" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">Terminal ferroviaire</text>

  <!-- RAIL -->
  <path id="trainPath" d="M620,140 L900,190" fill="none"/>
  <path d="M620,136 L900,186" stroke="#475569" stroke-width="2" fill="none"/>
  <path d="M620,144 L900,194" stroke="#475569" stroke-width="2" fill="none"/>
  <line x1="650" y1="139" x2="650" y2="151" stroke="#475569" stroke-width="2"/>
  <line x1="690" y1="146" x2="690" y2="158" stroke="#475569" stroke-width="2"/>
  <line x1="730" y1="154" x2="730" y2="166" stroke="#475569" stroke-width="2"/>
  <line x1="770" y1="161" x2="770" y2="173" stroke="#475569" stroke-width="2"/>
  <line x1="810" y1="168" x2="810" y2="180" stroke="#475569" stroke-width="2"/>
  <line x1="850" y1="175" x2="850" y2="187" stroke="#475569" stroke-width="2"/>
  <line x1="890" y1="182" x2="890" y2="194" stroke="#475569" stroke-width="2"/>
  <text x="775" y="84" text-anchor="middle" font-size="19" fill="#047857" font-weight="700">Fret ferroviaire</text>

  <!-- TRAIN: locomotive + cargo car with BK pennant -->
  <g>
    <animateMotion dur="4s" begin="2s" repeatCount="indefinite" rotate="auto">
      <mpath href="#trainPath"/>
    </animateMotion>
    <g transform="translate(-39,-20)">
      <rect x="2" y="6" width="28" height="14" fill="#B45309"/>
      <line x1="10" y1="6" x2="10" y2="20" stroke="#FFFFFF" stroke-width="0.6" opacity="0.25"/>
      <line x1="20" y1="6" x2="20" y2="20" stroke="#FFFFFF" stroke-width="0.6" opacity="0.25"/>
      <line x1="30" y1="16" x2="34" y2="16" stroke="#475569" stroke-width="1.6"/>
      <rect x="34" y="4" width="30" height="16" rx="4" fill="#047857"/>
      <rect x="52" y="7" width="8" height="6" rx="1" fill="#F8FAFC" opacity="0.9"/>
      <path d="M64,4 L74,10 L64,20 Z" fill="#047857"/>
      <line x1="48" y1="4" x2="48" y2="-16" stroke="#475569" stroke-width="1.4"/>
      <path d="M48,-16 L76,-9 L48,-2 Z" fill="#B45309"/>
      <text x="51" y="-7" font-size="9.5" font-weight="800" fill="#FFFFFF">BK</text>
      <g transform="translate(8,20)"><circle r="4" fill="#0F172A"/><line x1="0" y1="-3.4" x2="0" y2="3.4" stroke="#F8FAFC" stroke-width="1"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.35s" repeatCount="indefinite"/></line></g>
      <g transform="translate(22,20)"><circle r="4" fill="#0F172A"/><line x1="0" y1="-3.4" x2="0" y2="3.4" stroke="#F8FAFC" stroke-width="1"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.35s" repeatCount="indefinite"/></line></g>
      <g transform="translate(42,20)"><circle r="4" fill="#0F172A"/><line x1="0" y1="-3.4" x2="0" y2="3.4" stroke="#F8FAFC" stroke-width="1"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.35s" repeatCount="indefinite"/></line></g>
      <g transform="translate(58,20)"><circle r="4" fill="#0F172A"/><line x1="0" y1="-3.4" x2="0" y2="3.4" stroke="#F8FAFC" stroke-width="1"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.35s" repeatCount="indefinite"/></line></g>
    </g>
  </g>

  <!-- HUB 3 -->
  <circle cx="900" cy="190" r="8" fill="#047857" stroke="#FFFFFF" stroke-width="3"/>
  <text x="900" y="164" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">Base logistique</text>

  <!-- ROAD -->
  <path d="M900,190 Q1060,260 1220,320" stroke="#94A3B8" stroke-width="10" fill="none" opacity="0.35"/>
  <path id="truckPath" d="M900,190 Q1060,260 1220,320" fill="none"/>
  <path d="M900,190 Q1060,260 1220,320" stroke="#FFFFFF" stroke-dasharray="10 8" stroke-width="2.5" fill="none"/>
  <text x="1075" y="239" text-anchor="middle" font-size="19" fill="#0F172A" font-weight="700" opacity="0.95">Dernier kilomètre</text>

  <!-- TRUCK: cab + trailer with BK pennant -->
  <g>
    <animateMotion dur="4s" begin="3s" repeatCount="indefinite" rotate="auto">
      <mpath href="#truckPath"/>
    </animateMotion>
    <g transform="translate(-24,-22)">
      <rect x="0" y="4" width="34" height="18" rx="2" fill="#B45309"/>
      <line x1="10" y1="4" x2="10" y2="22" stroke="#FFFFFF" stroke-width="0.6" opacity="0.25"/>
      <line x1="22" y1="4" x2="22" y2="22" stroke="#FFFFFF" stroke-width="0.6" opacity="0.25"/>
      <path d="M34,8 L34,22 L44,22 L48,16 L48,10 L44,8 Z" fill="#0F172A"/>
      <path d="M38,10 L44,10 L46,14 L38,14 Z" fill="#F8FAFC" opacity="0.9"/>
      <line x1="40" y1="8" x2="40" y2="-12" stroke="#475569" stroke-width="1.3"/>
      <path d="M40,-12 L64,-5 L40,2 Z" fill="#B45309"/>
      <text x="42.5" y="-4" font-size="8.5" font-weight="800" fill="#FFFFFF">BK</text>
      <g transform="translate(8,22)"><circle r="3.6" fill="#0F172A"/><line x1="0" y1="-3" x2="0" y2="3" stroke="#F8FAFC" stroke-width="0.9"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.4s" repeatCount="indefinite"/></line></g>
      <g transform="translate(26,22)"><circle r="3.6" fill="#0F172A"/><line x1="0" y1="-3" x2="0" y2="3" stroke="#F8FAFC" stroke-width="0.9"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.4s" repeatCount="indefinite"/></line></g>
      <g transform="translate(42,22)"><circle r="3.6" fill="#0F172A"/><line x1="0" y1="-3" x2="0" y2="3" stroke="#F8FAFC" stroke-width="0.9"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.4s" repeatCount="indefinite"/></line></g>
    </g>
  </g>

  <!-- DESTINATION -->
  <g transform="translate(1220,320)">
    <circle r="10" fill="#B45309"/>
    <circle r="16" fill="none" stroke="#B45309" stroke-width="2" opacity="0.5">
      <animate attributeName="r" values="10;22;10" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="1220" y="348" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">Mission terrain</text>
</svg>
